name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; defaults to the manifest version
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      CC: clang
      CXX: clang++
      HYPERGLASS_ANDROID_PLATFORM: android-37.0
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check release version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse('module/AndroidManifest.xml').getroot()
          version = root.attrib['{http://schemas.android.com/apk/res/android}versionName']
          tag = os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF_TYPE'] == 'tag' else os.environ.get('REQUESTED_TAG') or 'v' + version
          assert tag == 'v' + version, (tag, version)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('VERSION=' + version + '\nRELEASE_TAG=' + tag + '\n')
          PY
      - name: Install Android tools and Python dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$SDKMANAGER" --licenses > /dev/null)
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          python -m pip install -r requirements.txt
      - name: Download private reference fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ci-inputs fixtures/reference
          gh release download build-inputs-v1 --repo "$GITHUB_REPOSITORY" --pattern reference-fixtures.tar.gz --dir .ci-inputs
          sha256sum --check config/reference-fixtures.sha256
          tar -xzf .ci-inputs/reference-fixtures.tar.gz -C fixtures/reference
      - name: Restore release key
        env:
          RELEASE_JKS_BASE64: ${{ secrets.RELEASE_JKS_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os, base64
          from pathlib import Path
          value = os.environ['RELEASE_JKS_BASE64']
          assert value, 'Missing RELEASE_JKS_BASE64'
          Path('signing').mkdir(exist_ok=True)
          Path('signing/release.jks').write_bytes(base64.b64decode(value, validate=True))
          PY
      - name: Build and audit signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: python build.py --signing-dir signing
      - name: Run native resolver and relocated ARM64 tests
        run: python module/test_host.py
      - name: Save signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HyperGlass-${{ env.VERSION }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: HyperGlass ${{ env.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.apk.sha256
      - name: Remove signing material
        if: always()
        run: rm -rf signing
